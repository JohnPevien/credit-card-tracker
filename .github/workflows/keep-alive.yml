name: Supabase Keep-Alive

# Backup to Vercel Cron — pings Supabase every day at 17:00 UTC (12h offset
# from Vercel's 05:00 UTC cron). Either trigger is enough to keep the
# free-tier project from pausing after 7 days of inactivity, but both
# together survive a single missed run on one provider.
on:
  schedule:
    - cron: "0 17 * * *"
  workflow_dispatch:

jobs:
  keep-alive:
    runs-on: ubuntu-latest
    timeout-minutes: 5
    steps:
      - name: Ping Vercel keep-alive endpoint
        env:
          APP_URL: ${{ secrets.APP_URL }}
          # Vercel Cron secret — if set, sent as Bearer so the endpoint can verify caller
          CRON_SECRET: ${{ secrets.CRON_SECRET }}
          # Fallback public URL for forks / manual runs without secrets
          FALLBACK_URL: "https://credit-card-tracker.vercel.app"
        run: |
          set -euo pipefail

          if [ -n "${APP_URL:-}" ]; then
            TARGET="${APP_URL%/}/api/keep-alive"
          else
            echo "::notice::APP_URL secret not set — using FALLBACK_URL ($FALLBACK_URL)"
            TARGET="${FALLBACK_URL}/api/keep-alive"
          fi

          echo "→ GET $TARGET"

          AUTH_ARGS=()
          if [ -n "${CRON_SECRET:-}" ]; then
            AUTH_ARGS=(-H "Authorization: Bearer $CRON_SECRET")
          fi

          # Retry 3x with backoff; fail the step only if all attempts fail
          for attempt in 1 2 3; do
            HTTP_CODE=$(curl -sS -o /tmp/keep-alive.json -w "%{http_code}" \
              "${AUTH_ARGS[@]}" \
              -H "Cache-Control: no-cache" \
              -H "Pragma: no-cache" \
              --max-time 25 \
              "$TARGET" || echo "000")

            echo "Attempt $attempt: HTTP $HTTP_CODE"
            cat /tmp/keep-alive.json || true
            echo ""

            if [ "$HTTP_CODE" -ge 200 ] && [ "$HTTP_CODE" -lt 400 ]; then
              # Validate the JSON reports ok:true when present, but don't fail on shape change
              if grep -q '"ok": *true' /tmp/keep-alive.json; then
                echo "✓ keep-alive endpoint returned ok:true"
                exit 0
              fi
              if [ "$HTTP_CODE" -eq 200 ]; then
                echo "✓ keep-alive endpoint returned HTTP 200"
                exit 0
              fi
            fi

            if [ "$attempt" -lt 3 ]; then
              echo "Retrying in 10s..."
              sleep 10
            fi
          done

          echo "::warning::Vercel keep-alive endpoint did not return ok:true after 3 attempts — trying direct Supabase ping"
          exit 1

      - name: Direct Supabase ping (fallback if endpoint unreachable)
        if: failure()
        env:
          SUPABASE_URL_PRIMARY: ${{ secrets.NEXT_PUBLIC_SUPABASE_URL }}
          SUPABASE_URL_FALLBACK: ${{ secrets.SUPABASE_URL }}
          SUPABASE_ANON_PRIMARY: ${{ secrets.NEXT_PUBLIC_SUPABASE_ANON_KEY }}
          SUPABASE_ANON_FALLBACK: ${{ secrets.SUPABASE_ANON_KEY }}
          SUPABASE_SERVICE_PRIMARY: ${{ secrets.SUPABASE_SERVICE_ROLE_KEY }}
          SUPABASE_SERVICE_FALLBACK: ${{ secrets.SUPABASE_SERVICE_KEY }}
        run: |
          set -euo pipefail

          # Resolve URL / key: NEXT_PUBLIC_* wins, else plain name; service_role > anon
          URL="${SUPABASE_URL_PRIMARY:-${SUPABASE_URL_FALLBACK:-}}"
          SERVICE_KEY="${SUPABASE_SERVICE_PRIMARY:-${SUPABASE_SERVICE_FALLBACK:-}}"
          ANON_KEY="${SUPABASE_ANON_PRIMARY:-${SUPABASE_ANON_FALLBACK:-}}"
          KEY="${SERVICE_KEY:-$ANON_KEY}"
          if [ -n "$SERVICE_KEY" ]; then
            KEY_TYPE="service_role"
          else
            KEY_TYPE="anon"
          fi

          if [ -z "$URL" ] || [ -z "$KEY" ]; then
            echo "::warning::Supabase secrets not set — skipping direct ping (set SUPABASE_URL + SUPABASE_SERVICE_ROLE_KEY or NEXT_PUBLIC_SUPABASE_* secrets)"
            # Don't fail the workflow — the Vercel ping is the primary keep-alive
            exit 0
          fi

          echo "→ Direct PostgREST ping ($KEY_TYPE) to $URL"

          TABLES="persons credit_cards purchases transactions"
          ANY_OK=false

          for table in $TABLES; do
            echo "  probing $table..."
            CODE=$(curl -sS -o /tmp/ping.json -w "%{http_code}" \
              -H "apikey: $KEY" \
              -H "Authorization: Bearer $KEY" \
              -H "Cache-Control: no-cache" \
              --max-time 15 \
              "${URL%/}/rest/v1/${table}?select=id&limit=1" || echo "000")
            echo "    HTTP $CODE $(cat /tmp/ping.json | head -c 200)"
            if [ "$CODE" -ge 200 ] && [ "$CODE" -lt 400 ]; then
              ANY_OK=true
            fi
          done

          if [ "$ANY_OK" = true ]; then
            echo "✓ At least one table responded — Supabase is awake"
            exit 0
          else
            echo "::error::All direct Supabase pings failed"
            exit 1
          fi
